spring.application.name=order-billing-backend

# Server port
server.port=8080

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/orderbillingdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=654321
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Disable H2 console
# spring.h2.console.enabled=false
# spring.h2.console.path=/h2-console

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable CORS globally for React frontend
spring.mvc.cors.allowed-origins=http://localhost:5177
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
